version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: broker-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: broker-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trading
      DB_USER: postgres
      DB_PASSWORD: postgres
      BROKER_BASE_URL: ${BROKER_BASE_URL:-https://api.broker.example.com}
      BROKER_WS_URL: ${BROKER_WS_URL:-wss://ws.broker.example.com}
      BROKER_CLIENT_ID: ${BROKER_CLIENT_ID:-}
      BROKER_CLIENT_SECRET: ${BROKER_CLIENT_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pg-data:
